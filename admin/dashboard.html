<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard — TIMS Institute</title>
  <link rel="icon" type="image/png" href="../assets/images/icon.png" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    .dashboard {
      display: flex;
      height: calc(100vh - 70px);
      overflow: hidden;
    }

    .sidebar {
      width: 300px;
      border-right: 1px solid var(--border-color, #eaeaea);
      overflow-y: auto;
      background: var(--bg-card, #fff);
      padding: 20px;
    }

    .form-list-item {
      padding: 12px 15px;
      margin-bottom: 10px;
      background: var(--bg-body, #fafafa);
      border: 1px solid var(--border-color, #eaeaea);
      border-radius: var(--radius-md, 8px);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s;
    }

    .form-list-item:hover,
    .form-list-item.active {
      border-color: var(--primary, #007bff);
      box-shadow: 0 0 0 1px var(--primary, #007bff);
    }

    .form-list-item .status {
      font-size: 0.8rem;
      padding: 2px 6px;
      border-radius: 10px;
      background: var(--muted, #6c757d);
      color: #fff;
    }

    .form-list-item .status.done {
      background: #28a745;
    }

    .content {
      flex: 1;
      padding: 30px;
      overflow-y: auto;
      background: var(--bg-body, #fafafa);
    }

    .form-details {
      background: var(--bg-card, #fff);
      padding: 30px;
      border-radius: var(--radius-lg, 12px);
      box-shadow: var(--shadow-sm, 0 2px 8px rgba(0, 0, 0, 0.05));
    }

    .detail-row {
      margin-bottom: 15px;
      border-bottom: 1px solid var(--border-color, #eaeaea);
      padding-bottom: 15px;
    }

    .detail-label {
      font-weight: 600;
      color: var(--muted, #6c757d);
      font-size: 0.9rem;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 1.1rem;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .dropdown {
      position: relative;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background-color: var(--bg-card, #fff);
      min-width: 200px;
      box-shadow: var(--shadow-md, 0 4px 12px rgba(0, 0, 0, 0.1));
      border-radius: var(--radius-md, 8px);
      z-index: 10;
      overflow: hidden;
      border: 1px solid var(--border-color, #eaeaea);
    }

    .dropdown-content a {
      color: var(--text-color, #333);
      padding: 12px 16px;
      text-decoration: none;
      display: block;
      transition: background 0.3s;
    }

    .dropdown-content a:hover {
      background-color: var(--bg-body, #fafafa);
    }

    .dropdown:hover .dropdown-content {
      display: block;
      animation: fadeIn 0.2s ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <header style="height: 70px; border-bottom: 1px solid var(--border-color, #eaeaea);">
    <nav class="navbar" role="navigation">
      <div class="container" style="max-width: 100%; padding: 0 30px;">
        <div class="navbar-inner">
          <a href="/" class="navbar-logo"><img src="../assets/images/TimsLogo.png" alt="TIMS Institute" /></a>
          <div class="navbar-actions">
            <button class="btn btn-outline" onclick="logout()">Logout</button>
          </div>
        </div>
      </div>
    </nav>
  </header>

  <main class="dashboard">
    <div class="sidebar" id="sidebar">
      <h3 style="margin-bottom: 20px;">Submissions</h3>
      <div id="form-list">Loading...</div>
    </div>
    <div class="content">
      <div class="top-bar">
        <h2>Form Details</h2>
        <div class="dropdown">
          <button class="btn btn-primary">Export ▼</button>
          <div class="dropdown-content">
            <a href="#" onclick="exportData('csv')">Google Sheet (CSV)</a>
            <a href="#" onclick="exportData('xlsx')">Microsoft Excel (CSV)</a>
          </div>
        </div>
      </div>
      <div class="form-details" id="form-details" style="display:none;">
        <!-- Details will be loaded here -->
      </div>
      <div id="no-selection" style="text-align:center; padding: 50px; color: var(--muted, #6c757d);">
        Select a form from the sidebar to view details.
      </div>
    </div>
  </main>

  <script>
    let formData = [];
    let currentForm = null;

    async function loadForms() {
      try {
        const token = localStorage.getItem('admin_token');
        if (!token) { window.location.href = '/admin'; return; }

        const res = await fetch('/api/forms', {
          headers: { 'Authorization': token }
        });
        if (res.ok) {
          const text = await res.text();
          try {
            formData = JSON.parse(text);
          } catch (e) {
            console.error("Failed to parse JSON:", text);
            document.getElementById('form-list').innerHTML = '<p style="color:red">Error parsing data.</p>';
            return;
          }
          renderSidebar();
        } else {
          localStorage.removeItem('admin_token');
          window.location.href = '/admin';
        }
      } catch (err) {
        console.error(err);
        document.getElementById('form-list').innerHTML = '<p style="color:red">Failed to load forms.</p>';
      }
    }

    function renderSidebar() {
      const list = document.getElementById('form-list');
      list.innerHTML = '';
      if (!Array.isArray(formData) || formData.length === 0) {
        list.innerHTML = '<p>No forms submitted yet.</p>';
        return;
      }
      formData.slice().reverse().forEach(form => {
        if (!form) return;
        const div = document.createElement('div');
        div.className = 'form-list-item';
        div.onclick = () => selectForm(form, div);

        const nameSpan = document.createElement('span');
        nameSpan.textContent = form.fullName || 'Anonymous';

        const statusSpan = document.createElement('span');
        statusSpan.className = 'status ' + (form.actionTaken ? 'done' : '');
        statusSpan.innerHTML = form.actionTaken ? '✔ Done' : 'Pending';

        div.appendChild(nameSpan);
        div.appendChild(statusSpan);
        list.appendChild(div);
      });
    }

    function selectForm(form, element) {
      currentForm = form;
      document.querySelectorAll('.form-list-item').forEach(el => el.classList.remove('active'));
      if (element) element.classList.add('active');

      document.getElementById('no-selection').style.display = 'none';
      const details = document.getElementById('form-details');
      details.style.display = 'block';

      let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
                    <h3 style="margin:0;">${form.fullName || 'Details'}</h3>
                    ${!form.actionTaken ? `<button class="btn btn-primary" onclick="takeAction('${form.id}')">Action Taken For This Form</button>` : '<span style="color:green; font-weight:bold; display: flex; align-items: center; gap: 5px;"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Action Taken</span>'}
                  </div>`;

      for (let key in form) {
        if (key === 'actionTaken') continue;
        html += `<div class="detail-row">
                   <div class="detail-label">${key.toUpperCase()}</div>
                   <div class="detail-value">${form[key]}</div>
                 </div>`;
      }
      details.innerHTML = html;
    }

    async function takeAction(id) {
      const token = localStorage.getItem('admin_token');
      const res = await fetch(`/api/forms/${id}/action`, {
        method: 'POST',
        headers: { 'Authorization': token }
      });
      if (res.ok) {
        await loadForms();
        const updatedForm = formData.find(f => f.id === id);
        if (updatedForm) {
          // Re-render currently selected form
          const items = document.querySelectorAll('.form-list-item');
          let elToSelect = null;
          items.forEach(el => {
            if (el.textContent.includes(updatedForm.fullName) || el.textContent.includes('Anonymous')) {
              // This is a naive way to find the element, but good enough for simple use
              if (el.classList.contains('active')) elToSelect = el;
            }
          });
          selectForm(updatedForm, elToSelect);
        }
      }
    }

    function exportData(type) {
      if (!formData || formData.length === 0) return alert('No data to export');

      // Collect all possible keys from all forms
      const allKeys = new Set();
      formData.forEach(form => Object.keys(form).forEach(k => allKeys.add(k)));
      const headers = Array.from(allKeys);

      const csvRows = [];
      csvRows.push(headers.join(','));

      for (const row of formData) {
        const values = headers.map(header => {
          const val = row[header] !== undefined && row[header] !== null ? row[header].toString().replace(/"/g, '""') : '';
          return `"${val}"`;
        });
        csvRows.push(values.join(','));
      }

      const blob = new Blob([csvRows.join('\\n')], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `FormData_${new Date().getTime()}.csv`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function logout() {
      localStorage.removeItem('admin_token');
      window.location.href = '/admin';
    }

    window.onload = loadForms;
  </script>
</body>

</html>
