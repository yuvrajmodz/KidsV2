<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — TIMS Institute</title>
  <link rel="icon" type="image/png" href="../assets/images/icon.png" />
  <link rel="stylesheet" href="../assets/css/style.css" />
  <style>
    .admin-login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <nav class="navbar" role="navigation">
      <div class="container">
        <div class="navbar-inner">
          <a href="/" class="navbar-logo"><img src="../assets/images/TimsLogo.png" alt="TIMS Institute" /></a>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <div class="container">
      <div class="admin-login-container">
        <h2 style="margin-bottom: 20px;">Admin Portal</h2>
        <form id="admin-login-form">
          <div class="form-group" style="text-align: left;">
            <label class="form-label" for="username">Enter Username</label>
            <input type="text" id="username" name="username" class="form-control" placeholder="Enter Username" required />
          </div>
          <div class="form-group" style="text-align: left;">
            <label class="form-label" for="password">Enter Password</label>
            <input type="password" id="password" name="password" class="form-control" placeholder="Enter Password" required />
          </div>
          <div id="login-error" class="form-error" style="margin-bottom:15px; display:none; color: red;"></div>
          <button type="submit" class="btn btn-primary btn-full">Login</button>
        </form>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const err = document.getElementById('login-error');
      
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({username: u, password: p})
      });
      const data = await res.json();
      if(res.ok) {
        localStorage.setItem('admin_token', data.token);
        window.location.href = '/admin/dashboard';
      } else {
        err.textContent = data.error || 'Access Denied';
        err.style.display = 'block';
      }
    });
  </script>
</body>
</html>
